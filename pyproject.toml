[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosei-mer-redo"
version = "0.1.0"
description = "Multimodal emotion recognition pipeline and MOSEI subset tooling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "torchvision>=0.17",
  "torchaudio>=2.2",
  "torchmetrics>=1.3",
  "lightning>=2.2",
  "transformers>=4.40",
  "tensorboard>=2.14",
  "pyarrow>=14.0",
  "yt-dlp>=2024.3.10",
]

[tool.setuptools]
py-modules = [
  "build_manifest",
  "datamodule",
  "dataset",
  "data_loader",
  "lightning_module",
  "model",
  "subset_data",
  "train",
]
